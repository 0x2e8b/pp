; Two programs in the api container: the web (non-root) and the worker (root, runs npcapextract).
; Each is restarted on its own; supervisord never gives up (high startretries). Logs of both go to
; the container's stdout. The control socket is root-only and there is no TCP listener.
[supervisord]
nodaemon=true
; without silent, nodaemon also echoes every log line to the console, so each one appeared twice
silent=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:web]
command=/app/.venv/bin/gunicorn -c /app/gunicorn.conf.py sycope_recorder.main:app
directory=/app
user=sr
umask=002
environment=HOME="/tmp"
autorestart=true
startsecs=5
startretries=1000000
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=/app/.venv/bin/python -m sycope_recorder worker
directory=/app
user=root
umask=002
autorestart=true
startsecs=5
startretries=1000000
stopsignal=TERM
stopwaitsecs=%(ENV_SR_WORKER_STOPWAIT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
